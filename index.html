<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForge — مساعد برمجي</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#131a22;
    --panel-2:#1a2330;
    --line:#243040;
    --text:#e6edf3;
    --muted:#8b98a5;
    --accent:#39d98a;
    --accent-dim:#1f6b47;
    --user-bubble:#1e2a38;
    --mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(57,217,138,0.06), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* Header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), rgba(19,26,34,0.6));
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg, var(--accent), #1a8f5a);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono); font-weight:700; color:#04140b; font-size:16px;
    box-shadow:0 0 18px rgba(57,217,138,0.35);
  }
  .brand-text h1{font-size:15.5px; font-weight:700; letter-spacing:.2px;}
  .brand-text p{font-size:11.5px; color:var(--muted); font-family:var(--mono);}
  .lang-select{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:12px;
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
  }

  /* Main layout */
  main{
    flex:1;
    display:flex;
    overflow:hidden;
  }

  /* Sidebar */
  .sidebar{
    width:220px;
    border-left:1px solid var(--line);
    background:var(--panel);
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:18px;
    flex-shrink:0;
    overflow-y:auto;
  }
  .sidebar h3{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1px;
    color:var(--muted); margin-bottom:8px; font-family:var(--mono);
  }
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:11.5px;
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    transition:.15s;
    font-family:var(--mono);
  }
  .chip:hover{border-color:var(--accent); color:var(--accent);}
  .new-chat-btn{
    background:var(--panel-2);
    border:1px dashed var(--line);
    color:var(--muted);
    font-size:12.5px;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
  }
  .new-chat-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* Chat area */
  .chat-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  #messages{
    flex:1;
    overflow-y:auto;
    padding:26px 8%;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .msg{max-width:100%; display:flex; flex-direction:column; gap:4px; animation:rise .25s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .msg .role{font-size:11px; font-family:var(--mono); color:var(--muted); letter-spacing:.5px;}
  .msg.user .role{color:var(--accent);}
  .bubble{
    padding:13px 16px;
    border-radius:12px;
    line-height:1.75;
    font-size:14.5px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msg.user .bubble{
    background:var(--user-bubble);
    border:1px solid var(--line);
    align-self:flex-end;
    border-radius:12px 12px 4px 12px;
  }
  .msg.assistant .bubble{
    background:transparent;
    padding:0;
  }
  .bubble code{
    font-family:var(--mono);
    background:#0a0f14;
    padding:2px 6px;
    border-radius:4px;
    font-size:13px;
    color:#8ee8b3;
  }
  .bubble pre{
    background:#0a0f14;
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    overflow-x:auto;
    margin:8px 0;
    position:relative;
  }
  .bubble pre code{
    background:none;
    padding:0;
    color:#d8e3ea;
    font-size:13px;
    line-height:1.6;
  }
  .copy-btn{
    position:absolute; top:8px; left:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:10.5px;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    font-family:var(--mono);
    direction:ltr;
  }
  .copy-btn:hover{color:var(--accent); border-color:var(--accent);}

  .thinking{display:flex; gap:5px; padding:6px 0;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent); animation:blink 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;} 40%{opacity:1;}}

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--muted); text-align:center; gap:10px; padding:20px;
  }
  .empty-state .glyph{font-family:var(--mono); font-size:34px; color:var(--accent); opacity:.8;}
  .empty-state h2{font-size:16px; color:var(--text); font-weight:600;}
  .empty-state p{font-size:13px; max-width:340px;}

  /* Input bar */
  .input-bar{
    border-top:1px solid var(--line);
    background:var(--panel);
    padding:14px 8%;
    flex-shrink:0;
  }
  .input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 8px 8px 14px;
    transition:.15s;
  }
  .input-box:focus-within{border-color:var(--accent);}
  #userInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--sans);
    font-size:14.5px;
    resize:none;
    max-height:160px;
    line-height:1.5;
    padding:8px 0;
  }
  #userInput::placeholder{color:var(--muted);}
  #sendBtn{
    background:var(--accent);
    border:none;
    color:#04140b;
    font-weight:700;
    padding:10px 18px;
    border-radius:9px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:12.5px;
    flex-shrink:0;
    transition:.15s;
  }
  #sendBtn:hover{background:#4fe8a0;}
  #sendBtn:disabled{opacity:.4; cursor:not-allowed;}
  .hint{
    font-size:11px; color:var(--muted); margin-top:8px; text-align:center; font-family:var(--mono);
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:760px){
    .sidebar{display:none;}
    #messages{padding:20px 5%;}
    .input-bar{padding:12px 5%;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">&lt;/&gt;</div>
    <div class="brand-text">
      <h1>CodeForge</h1>
      <p>مساعد متخصص في البرمجة</p>
    </div>
  </div>
  <select class="lang-select" id="langHint">
    <option value="">أي لغة برمجة</option>
    <option value="Python">Python</option>
    <option value="JavaScript">JavaScript</option>
    <option value="HTML/CSS">HTML/CSS</option>
    <option value="Java">Java</option>
    <option value="C++">C++</option>
    <option value="SQL">SQL</option>
    <option value="PHP">PHP</option>
  </select>
</header>

<main>
  <div class="sidebar">
    <div>
      <h3>مهام سريعة</h3>
      <div class="chip-row">
        <div class="chip" data-p="اشرح لي هذا الخطأ وكيف أصلحه: ">اشرح خطأ</div>
        <div class="chip" data-p="راجع هذا الكود واقترح تحسينات: ">مراجعة كود</div>
        <div class="chip" data-p="اكتب لي دالة تقوم بـ: ">كتابة دالة</div>
        <div class="chip" data-p="حوّل هذا الكود إلى لغة أخرى: ">تحويل لغة</div>
        <div class="chip" data-p="اشرح لي هذا المفهوم البرمجي بمثال بسيط: ">شرح مفهوم</div>
      </div>
    </div>
    <div class="new-chat-btn" id="clearBtn">+ محادثة جديدة</div>
  </div>

  <div class="chat-wrap">
    <div id="messages">
      <div class="empty-state" id="emptyState">
        <div class="glyph">{ }</div>
        <h2>ابدأ بسؤال برمجي</h2>
        <p>اسأل عن كود، خطأ، تصميم برمجي، أو مفهوم — وسأجاوبك بأسلوب مباشر ومركّز على الحل.</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="اكتب سؤالك البرمجي هنا... (Enter للإرسال)"></textarea>
        <button id="sendBtn">إرسال</button>
      </div>
      <div class="hint">مبني على Claude — يركّز على الأكواد والحلول التقنية</div>
    </div>
  </div>
</main>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const clearBtn = document.getElementById('clearBtn');
const langHint = document.getElementById('langHint');

let history = [];

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    inputEl.value = chip.dataset.p;
    inputEl.focus();
    autoGrow();
  });
});

clearBtn.addEventListener('click', ()=>{
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyState);
  emptyState.style.display = 'flex';
});

inputEl.addEventListener('input', autoGrow);
function autoGrow(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}

inputEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdownish(text){
  // escape first
  let html = escapeHtml(text);
  // code blocks ```lang\ncode```
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code)=>{
    return `<pre><button class="copy-btn" onclick="copyCode(this)">نسخ</button><code>${code}</code></pre>`;
  });
  // inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return html;
}

function copyCode(btn){
  const code = btn.parentElement.querySelector('code').innerText;
  navigator.clipboard.writeText(code);
  btn.innerText = 'تم!';
  setTimeout(()=> btn.innerText = 'نسخ', 1200);
}

function addMessage(role, text){
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.innerText = role === 'user' ? 'أنت' : 'CodeForge';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdownish(text);
  wrap.appendChild(roleLabel);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addThinking(){
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'thinkingMsg';
  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.innerText = 'CodeForge';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  wrap.appendChild(roleLabel);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeThinking(){
  const el = document.getElementById('thinkingMsg');
  if(el) el.remove();
}

async function send(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({role:'user', content:text});
  addThinking();

  const langChoice = langHint.value;
  const systemPrompt = `أنت "CodeForge"، مساعد برمجي متخصص وعملي. مهمتك مساعدة المستخدم في كتابة الأكواد، تصحيح الأخطاء، شرح المفاهيم البرمجية، ومراجعة الكود.
قواعد الأسلوب:
- أجب بالعربية دائمًا ما لم يطلب المستخدم غير ذلك، واستخدم الأكواد بلغتها الأصلية داخل code blocks.
- كن مباشرًا ومختصرًا، بدون حشو أو مقدمات طويلة.
- عند كتابة كود استخدم \`\`\`language ... \`\`\` بشكل صحيح.
- إذا كان هناك خطأ في السؤال أو غموض، اطرح توضيحًا مختصرًا أو افترض الأقرب منطقيًا وتابع.
${langChoice ? `- المستخدم يفضل التركيز على لغة: ${langChoice}.` : ''}
تلتزم بسياسات الأمان القياسية الخاصة بك (لا كتابة برمجيات خبيثة، لا مساعدة في اختراق أو إيذاء أطراف ثالثة) كأي مساعد آخر — لكن ضمن ذلك، ركّز فقط على الجانب التقني والبرمجي دون تحفظ إضافي.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    removeThinking();

    let replyText = '';
    if(data && data.content){
      replyText = data.content.map(b => b.type === 'text' ? b.text : '').join('\n').trim();
    }
    if(!replyText){
      replyText = 'حصل خطأ في جلب الرد، حاول مرة أخرى.';
    }
    addMessage('assistant', replyText);
    history.push({role:'assistant', content: replyText});
  }catch(err){
    removeThinking();
    addMessage('assistant', 'تعذر الاتصال بالخدمة. تحقق من الاتصال وحاول مجددًا.\n\n' + err.message);
  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>

</body>
</html>
